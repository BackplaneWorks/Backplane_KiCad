/*
 * Embedding the KiCad GUI in a host application's window (fork-only).
 *
 * These commands are served by the GUI `kicad` started with `--embedded`; see
 * BACKPLANE_EMBED.md for the flags, the window tree and the X11 messages.  They are
 * host-agnostic: nothing here names a particular host application.
 *
 * Window ids are native: an X11 XID on Linux, an HWND on Windows.  0 means none.
 */

syntax = "proto3";

package kiapi.backplane.embed;

import "common/types/base_types.proto";

enum FrameKind
{
  FK_UNKNOWN          = 0;
  FK_PCB              = 1;  // PCB_EDIT_FRAME
  FK_SCH              = 2;  // SCH_EDIT_FRAME
  FK_SYMBOL_EDITOR    = 3;  // SYMBOL_EDIT_FRAME
  FK_FOOTPRINT_EDITOR = 4;  // FOOTPRINT_EDIT_FRAME
  FK_PCB_3D           = 5;  // EDA_3D_VIEWER_FRAME of the PCB editor
  FK_OTHER            = 6;  // any other embedded, non-modal frame (viewers, calculator, ...)
  FK_GERBVIEW         = 7;  // GERBVIEW_FRAME, in KiCad's own process (bp.13, desktop only)
}

message FrameInfo
{
  FrameKind kind       = 1;
  string    document   = 2;  // absolute path of the frame's current file, if any
  string    title      = 3;
  bool      modified   = 4;
  uint64    window     = 5;  // the frame's native window (a child of the holder)
  int32     min_width  = 6;  // KiCad's own minimum size for the frame, device pixels
  int32     min_height = 7;
  bool      shown      = 8;  // KiCad has the frame shown (mapped) inside the holder
  bool      focused    = 9;  // the frame has the keyboard
  string    frame_name = 10; // KiCad's internal frame name, for diagnostics
  bool      realized   = 11; // shown to the toolkit (by ShowFrame or a prewarm): the host may
                             // XMapWindow/XUnmapWindow `window` itself; HideFrame clears it
  string          lib_id = 12;   // FK_FOOTPRINT_EDITOR / FK_SYMBOL_EDITOR: "Lib:Name" on screen (bp.13)
  repeated string files  = 13;   // FK_GERBVIEW: the Gerber / drill / job files loaded, absolute (bp.13)
}

// Parent (or re-parent) every embedded frame under a host window.
// `window` 0 detaches: the holder and every frame are unmapped and parked off-screen,
// never left as window-manager top-levels.
message AttachToParent
{
  uint64 window   = 1;  // container: X11 window with the root visual (24-bit), or an HWND
  uint64 toplevel = 2;  // the host's top-level window: dialogs are transient for it and are
                        // centred on it.  0 keeps the previous value (or, if none, uses
                        // `window`).  _BACKPLANE_FOCUS / _BACKPLANE_KEY go to `window`.
  double scale    = 3;  // the host's UI scale; recorded and reported (see BACKPLANE_EMBED.md)
}

message AttachToParentResponse
{
  uint64             holder = 1;  // the fork's holder window inside `window` (0 if detached)
  repeated FrameInfo frames = 2;
}

// Open a frame if needed and show (map) it inside the holder.  Geometry is the host's job: it
// moves and resizes the frame's window itself (XMoveResizeWindow / SetWindowPos), or passes
// the rectangle here.  While a modal dialog is open, ShowFrame answers AS_BUSY if it would
// have to open a frame; showing an open one still works.  `document` and `item` are optional:
//   FK_SCH: document = a sheet file to navigate to; item = a reference to cross-probe ("U3").
//   FK_PCB: item = a reference to select and centre ("U3").
//   FK_SYMBOL_EDITOR: item = a LIB_ID to load ("Device:R").
//   FK_FOOTPRINT_EDITOR: item = a LIB_ID to load ("Resistor_SMD:R_0603_1608Metric").
//   FK_PCB_3D: opens the PCB editor's 3D viewer (the PCB editor is loaded, hidden, if needed).
message ShowFrame
{
  FrameKind kind     = 1;
  string    document = 2;
  string    item     = 3;
  bool      focus    = 4;  // also give the frame the keyboard

  // Optional geometry in holder (= container) coordinates, device pixels, applied before the
  // frame is mapped so it never appears at a stale position.  Used when width and height > 0.
  int32     x        = 5;
  int32     y        = 6;
  int32     width    = 7;
  int32     height   = 8;

  // Open the frame without showing it (bp.9): loaded, laid out and painted once off-screen so its
  // canvas and GL context are ready, then left hidden; no map in the host's view, no flash.  The
  // work is queued for the UI thread's next idle time and the reply comes at once (the frame,
  // shown=false, when it is already open; kind only otherwise).  ET_FRAME_OPENED follows; no
  // ET_SHOW_REQUESTED, ET_FRAME_SHOWN or ET_FRAME_HIDDEN is posted for a prewarm.
  bool      prewarm  = 9;
}

message ShowFrameResponse
{
  FrameInfo          frame  = 1;
  repeated FrameInfo frames = 2;  // every frame after the change (bp.9), so no GetFrames is needed
}

// Hide (unmap) a frame without closing it.  Selects by kind, or by window when given.
message HideFrame
{
  FrameKind kind   = 1;
  uint64    window = 2;
}

message HideFrameResponse
{
  repeated FrameInfo frames = 1;  // every frame after the change (bp.9)
}

message GetFrames
{
}

message GetFramesResponse
{
  repeated FrameInfo frames   = 1;
  uint64             parent   = 2;
  uint64             toplevel = 3;
  uint64             holder   = 4;
  double             scale    = 5;
  repeated string    reserved_keys = 6;
  string             events_socket = 7;  // ipc:// URL of the long-poll socket for NextEvents
  ThemeMode          theme = 8;          // the theme set by SetTheme or --theme (bp.9)
  repeated Progress  progress = 9;       // jobs running now, for a resync after `lost` (bp.12)
}

enum EventType
{
  ET_UNKNOWN          = 0;
  ET_FRAME_OPENED     = 1;  // a frame was created and parked in the holder (frame set)
  ET_FRAME_CLOSED     = 2;  // a frame was destroyed (frame set, window no longer valid)
  ET_FRAME_SHOWN      = 3;
  ET_FRAME_HIDDEN     = 4;
  ET_TITLE_CHANGED    = 5;
  ET_MODIFIED_CHANGED = 6;
  ET_FOCUS_IN         = 7;  // a frame took the keyboard (for example after a click)
  ET_FOCUS_OUT        = 8;
  ET_SHOW_REQUESTED   = 9;  // KiCad itself asked to show a hidden frame (Edit Symbol, 3D, ...);
                            // the host decides, with ShowFrame.  detail = the API client whose
                            // request caused it (an agent's or the host's own RunAction, ...),
                            // empty when the person or KiCad on its own asked (bp.13)
  ET_DIALOG_OPENED    = 10; // a dialog (or modal frame) was mapped; detail = its title
  ET_DIALOG_CLOSED    = 11;
  ET_DETACHED         = 12; // the parent window went away, or the host moved the holder to the
                            // root itself; frames are parked, unmapped
  ET_DOCUMENT_CHANGED = 13; // a frame's document path changed
  ET_SELECTION_CHANGED = 14; // the person changed the selection in the PCB or schematic editor;
                             // Event.selection holds the new selection (empty = cleared)
  ET_DOCUMENT_RELOADED = 15; // the frame's document was reloaded from disk; detail = the file
  ET_RELOAD_CONFLICT   = 16; // the file changed on disk while the frame has unsaved changes;
                             // nothing was reloaded; detail = the file.  Resolve with
                             // ResolveConflict (or the person uses KiCad's infobar)
  ET_THEME_CHANGED     = 17; // the theme was applied; detail = "light", "dark" or "kicad"
  ET_ATTACHED          = 18; // the host moved the holder into another of its windows itself
                             // (XReparentWindow); that window is the parent now (focus/key
                             // messages go there).  detail = its id, decimal
  ET_COMMENT           = 19; // the person sent a note about the selection with "Comment to
                             // Backplane..." (or CommentSelection did); Event.comment holds it,
                             // Event.selection its ItemNames, detail = the note (bp.10)
  ET_DOCUMENT_EDITED   = 20; // a change was pushed (person or agent; docs/backplane/coedit.md);
                             // detail = JSON {seq, doc, actor, description, created, modified,
                             // deleted, rebased, undo}; actor "" is the person (bp.11)
  ET_AGENT_NOTICE      = 21; // a notice for an agent about its operation (deferred, rebased,
                             // dropped, undo_took_back); detail = JSON {kind, actor, doc,
                             // details} (bp.11)
  ET_PLAN_CHANGED      = 22; // the routing plan changed (docs/backplane/floorplanner.md);
                             // detail = JSON {board, revision, actor, ops} (bp.11)
  ET_AGENT_CONTROL     = 23; // the person paused, resumed or steered an agent from KiCad;
                             // detail = JSON {actor, action: "pause"|"resume"|"steer", text} (bp.11)
  ET_PROGRESS          = 24; // a long job (load, zone fill, DRC, library load, plot) started,
                             // progressed or ended; Event.progress (bp.12).  In --embedded no
                             // progress window is shown; the host draws it
  ET_EDITOR_REQUESTED  = 25; // KiCad itself opened or brought up a footprint or symbol editor
                             // ("Open Footprint", "Edit Symbol" from the board or schematic):
                             // Event.frame is that frame, lib_id filled, already loaded with the
                             // item; the host shows it as a tab (ShowFrame).  Posted with the
                             // ET_SHOW_REQUESTED a hidden frame also gets (bp.13)
                             // detail = the API client whose request caused it, as for
                             // ET_SHOW_REQUESTED; empty for the person
  ET_MARKER_CLICKED    = 26; // the person clicked a marker in the canvas: a host marker
                             // (Event.marker) or one of KiCad's DRC/ERC markers (Event.marker
                             // empty, Event.drc_marker set), so the host selects its row (bp.13)
  ET_CHECKS_DONE       = 27; // a RunChecks finished (or was cancelled); Event.checks (bp.13).
                             // The markers stay in the editor, as after the DRC/ERC dialog
  ET_FRAME_DRAWN       = 28; // after a ShowFrame, the frame's canvas finished its first redraw
                             // on screen: mapped, laid out at its size and painted.  Once per
                             // ShowFrame of a hidden frame; not for a prewarm.  detail = JSON
                             // {ms (since the ShowFrame), canvas: [width, height]} (bp.13).  A
                             // frame with no drawing canvas never posts it: cap the wait
}

message Event
{
  uint64    seq    = 1;
  EventType type   = 2;
  FrameInfo frame  = 3;
  string    detail = 4;
  ItemNames selection = 5;  // ET_SELECTION_CHANGED and ET_COMMENT
  Comment   comment   = 6;  // ET_COMMENT only
  Progress  progress  = 7;  // ET_PROGRESS only
  MarkerRef marker     = 8;  // ET_MARKER_CLICKED on a host marker (bp.13)
  Checks    checks     = 9;  // ET_CHECKS_DONE only (bp.13)
  Marker    drc_marker = 10; // ET_MARKER_CLICKED on a DRC/ERC marker (bp.13)
}

// Long poll.  Returns the events with seq > since, waiting up to wait_ms (at most 60000)
// for the first one.  On the main API socket wait_ms is ignored (treated as 0) so that a
// poll never blocks other requests; send long polls to GetFramesResponse.events_socket.
message NextEvents
{
  uint64 since   = 1;
  int32  wait_ms = 2;
  int32  max     = 3;  // 0 = up to 256
}

message NextEventsResponse
{
  repeated Event events = 1;
  uint64         next   = 2;  // pass as `since` next time
  bool           lost   = 3;  // events after `since` were dropped; call GetFrames to resync
}

// Show or hide KiCad's own chrome on every embedded frame (now and when frames open later).
// Unset fields keep their current value.  The defaults are all shown.
message SetChrome
{
  optional bool menubar       = 1;
  optional bool top_toolbar   = 2;  // the main and auxiliary top toolbars
  optional bool side_toolbars = 3;  // the left and right toolbars
  optional bool status_bar    = 4;
}

message SetChromeResponse
{
  bool menubar       = 1;
  bool top_toolbar   = 2;
  bool side_toolbars = 3;
  bool status_bar    = 4;
}

// Chords KiCad forwards to the host instead of handling, outside dialogs.
// Syntax: modifiers Ctrl, Shift, Alt, Meta joined with '+', then a key: one character
// ("K", "`") or Tab, Esc, Enter, Space, Backspace, Delete, Insert, Home, End, PageUp,
// PageDown, Left, Right, Up, Down, F1..F24.  An empty list forwards nothing.
// Default: Ctrl+K, Ctrl+J, Ctrl+Tab, Ctrl+Shift+Tab, Ctrl+`.
message SetReservedKeys
{
  repeated string chords = 1;
}

message SetReservedKeysResponse
{
  repeated string chords = 1;  // normalised; a chord that does not parse fails the request
}

enum CloseMode
{
  CM_FAIL_IF_MODIFIED = 0;  // refuse (AS_BAD_REQUEST, with the modified frames) if anything is unsaved
  CM_SAVE             = 1;  // save every modified document, then close
  CM_DISCARD          = 2;  // close without saving
}

// Close without KiCad's own "save changes?" prompts.  With kind FK_UNKNOWN and window 0
// every frame is closed and the process exits after the reply.  Otherwise only the selected
// frame is closed.
message Close
{
  CloseMode mode   = 1;
  FrameKind kind   = 2;
  uint64    window = 3;
}

message CloseResponse
{
  repeated FrameInfo modified = 1;  // the frames that were (or, when refused, are) modified
  bool               exiting  = 2;
}


// ---- bp.9 ----------------------------------------------------------------------------------

enum ThemeMode
{
  TM_KICAD = 0;  // no override: the person's own KiCad settings (colour themes, icons, GTK)
  TM_LIGHT = 1;
  TM_DARK  = 2;
}

// Switch the whole process live: GTK prefer-dark for wx/GTK widgets, the colour theme of every
// editor canvas (PCB, schematic, symbol and footprint editors) and the 3D viewer background,
// and KiCad's light/dark icon set.  Nothing is written to the person's KiCad settings files.
// Also `kicad --theme light|dark` at launch.
message SetTheme
{
  ThemeMode mode = 1;
}

message SetThemeResponse
{
  ThemeMode mode        = 1;
  bool      gtk_dark    = 2;  // GTK prefer-dark as applied
  string    color_theme = 3;  // the colour theme now drawn ("_builtin_default", "_builtin_backplane_dark", ...)
  string    icon_theme  = 4;  // "light" or "dark"
}

// Names of schematic/board items, as people write them.
message ItemNames
{
  repeated string references = 1;  // "U3"
  repeated string nets       = 2;  // "/SDA", "GND"
  repeated string pins       = 3;  // "<reference>.<pin number>", e.g. "U3.4"
}

// Select (replacing the selection), highlight and optionally zoom to items in the PCB editor
// or the schematic editor, whether that frame is shown or hidden (it must be open: use
// ShowFrame/HideFrame first otherwise).  Served by the frame itself, so it is routed by `kind`;
// a kind whose frame is not open answers AS_UNHANDLED.  Nets are highlighted (and their items
// selected in the schematic); references select symbols/footprints; pins select pins/pads.
// While a modal dialog is open it answers AS_BUSY.
message SelectItems
{
  FrameKind       kind       = 1;  // FK_PCB or FK_SCH
  repeated string references = 2;
  repeated string nets       = 3;
  repeated string pins       = 4;  // "U3.4"
  bool            zoom       = 5;  // zoom to fit what was found
  // bp.13
  repeated kiapi.common.types.KIID ids        = 6;  // exact items (tracks, vias, zones, wires,
                                                    // markers, ...), selected with the others
  kiapi.common.types.Vector2       at_nm      = 7;  // a place: centre the view there, at the
                                                    // current scale unless zoom_box_nm is set
  string                           sheet_path = 8;  // FK_SCH: go to this sheet first (KIID path,
                                                    // "/" root, as Marker.sheet_path)
  kiapi.common.types.Box2          zoom_box_nm = 9; // zoom to fit this box (overrides `zoom`)
}

message SelectItemsResponse
{
  ItemNames found     = 1;
  ItemNames not_found = 2;
  FrameKind kind      = 3;
  repeated kiapi.common.types.KIID ids_not_found = 4;  // bp.13
}

// Run DRC (FK_PCB) or ERC (FK_SCH) on the open document, saved or not, in the editor (no second
// copy of the board), as the DRC/ERC dialog does: the old markers go (exclusions are kept), the
// new ones stay in the editor.  Returns at once; ET_PROGRESS (id = progress_id, cancellable with
// CancelProgress) follows, then ET_CHECKS_DONE.  AS_BUSY while a modal dialog or a tool other
// than selection is active, or a check is already running.  (bp.13)
message RunChecks
{
  FrameKind kind         = 1;  // FK_PCB (DRC) or FK_SCH (ERC)
  bool      refill_zones = 2;  // FK_PCB: refill zones first (default: the current fills, as
                               // kicad-cli does)
  bool      parity       = 3;  // FK_PCB: also schematic parity
}

message RunChecksResponse
{
  uint64 progress_id = 1;
}

message Checks
{
  FrameKind kind        = 1;
  int32     errors      = 2;
  int32     warnings    = 3;
  int32     exclusions  = 4;
  int32     unconnected = 5;   // FK_PCB: unrouted connections
  bool      cancelled   = 6;
  uint64    progress_id = 7;   // the RunChecks that started it
  bool      document_modified = 8;  // the results are for unsaved state
  string    error       = 9;   // it could not run (e.g. the custom rules do not compile)
}

// For the host's ref (host markers, ET_MARKER_CLICKED): the set and the host's id.
message MarkerRef
{
  string set = 1;
  string id  = 2;
}

// ---- Host review markers (bp.13): host state, never written to .kicad_pcb / .kicad_sch, not in
// DRC/ERC results, not undoable.

enum MarkerSeverity
{
  MS_INFO    = 0;
  MS_WARNING = 1;
  MS_ERROR   = 2;
}

message HostMarker
{
  string                               id         = 1;  // the host's id, unique in its set
  string                               title      = 2;  // the one-liner
  MarkerSeverity                       severity   = 3;
  kiapi.common.types.Vector2           at_nm      = 4;  // where (if no items, else their centre
                                                        // when unset)
  repeated kiapi.common.types.KIID     items      = 5;  // what it is about
  string                               sheet_path = 6;  // FK_SCH: the sheet it is on (KIID path)
  string                               detail     = 7;  // longer text
  string                               layer      = 8;  // FK_PCB, optional: the layer name
}

// Replace the markers of one named set (an empty list clears it).  Drawn in the editor's
// overlay as rings in the host's colours (not KiCad's DRC arrows), a fixed size on screen.
message SetHostMarkers
{
  FrameKind           kind    = 1;  // FK_PCB or FK_SCH; other kinds AS_UNHANDLED
  string              set     = 2;  // e.g. "review", "agent:router"
  repeated HostMarker markers = 3;
}

message SetHostMarkersResponse
{
  int32 count = 1;   // markers now in the set
}

// The DRC/ERC markers in the editor now (after RunChecks, the DRC/ERC dialog, or loaded with
// the document).  (bp.13)
message GetMarkers
{
  FrameKind kind         = 1;  // FK_PCB or FK_SCH
  bool      include_host = 2;  // also the host's own markers (SetHostMarkers), when supported
}

message Marker
{
  string                           type       = 1;  // the DRC/ERC error key, e.g. "clearance"
  string                           severity   = 2;  // "error" | "warning" | "exclusion"
  bool                             excluded   = 3;
  string                           message    = 4;
  kiapi.common.types.Vector2       at_nm      = 5;
  repeated kiapi.common.types.KIID items      = 6;
  string                           sheet_path = 7;  // FK_SCH: the sheet's KIID path ("/" root)
  MarkerRef                        host       = 8;  // set for host markers (include_host)
  kiapi.common.types.KIID          id         = 9;  // the marker's own KIID
  string                           rule       = 10; // the custom rule's name, if one fired
  string                           layer      = 11; // FK_PCB: the layer name
  // bp.13: each item as kicad-cli's JSON report gives it (items[]: the same description text,
  // e.g. "Pad 1 [/SHPHLD] of SW3 on F.Cu"), so a row keyed from either run is the same row
  repeated MarkerItem               items_detail = 12;
  string                           group      = 13; // "violation" | "unconnected" | "parity":
                                                    // the CLI report's list it is in
  string                           comment    = 14; // an exclusion's reason, as the person wrote it
}

message MarkerItem
{
  kiapi.common.types.KIID    id          = 1;
  string                     description = 2;  // the CLI report's items[].description
  kiapi.common.types.Vector2 at_nm       = 3;  // the item's position (items[].pos), nm
  string                     sheet_path  = 4;  // FK_SCH: this item's sheet (KIID path); the two
                                               // items of one ERC violation can sit on different sheets
}

message GetMarkersResponse
{
  repeated Marker markers = 1;
}

enum ReloadMode
{
  RM_IF_CLEAN = 0;  // reload only if the document has no unsaved changes
  RM_DISCARD  = 1;  // reload even over unsaved changes (they are lost)
}

enum ReloadResult
{
  RR_UNKNOWN   = 0;
  RR_RELOADED  = 1;  // reloaded; view, active layer, selection (by UUID) and sheet kept
  RR_UNCHANGED = 2;  // the file on disk is what the frame already has
  RR_CONFLICT  = 3;  // RM_IF_CLEAN and the document has unsaved changes: nothing done
}

// Reload a frame's document from disk.  Selects the frame by kind (FK_PCB, FK_SCH) or by the
// absolute path of its file.
message ReloadDocument
{
  FrameKind  kind = 1;
  string     path = 2;
  ReloadMode mode = 3;
}

message ReloadDocumentResponse
{
  ReloadResult result = 1;
  FrameInfo    frame  = 2;
}

enum ConflictChoice
{
  CC_UNKNOWN = 0;
  CC_KEEP    = 1;  // keep the person's edits (and undo stack); the next save overwrites the file
  CC_RELOAD  = 2;  // drop the edits and reload from disk
}

// Answer a pending ET_RELOAD_CONFLICT (and hide KiCad's infobar for it).
message ResolveConflict
{
  FrameKind      kind   = 1;
  string         path   = 2;
  ConflictChoice choice = 3;
}

message ResolveConflictResponse
{
  ReloadResult result = 1;  // RR_RELOADED for CC_RELOAD, RR_UNCHANGED for CC_KEEP
  FrameInfo    frame  = 2;
}


// ---- bp.10: comments on a selection --------------------------------------------------------
//
// Coordinates are millimetres in the document's own frame, as written in the file: origin at the
// sheet/board origin (not the drill/aux or grid origin), X to the right, Y DOWN.

message BoxMm
{
  double x_min = 1;
  double y_min = 2;
  double x_max = 3;
  double y_max = 4;
}

// One selected item.
message CommentItem
{
  string kind       = 1;  // KiCad's class name: FOOTPRINT, PAD, PCB_TRACK, PCB_ARC, PCB_VIA,
                          // ZONE, PCB_SHAPE, PCB_TEXT, PCB_FIELD, ...; SCH_SYMBOL, SCH_PIN,
                          // SCH_LINE (wire/bus/graphic), SCH_LABEL, SCH_GLOBALLABEL,
                          // SCH_HIERLABEL, SCH_JUNCTION, SCH_NO_CONNECT, SCH_SHEET, SCH_FIELD, ...
  string id         = 2;  // the item's KIID (UUID)
  string reference  = 3;  // a footprint's or symbol's reference; the parent's for pads, pins and
                          // fields ("U3"); empty otherwise
  string pin        = 4;  // pads and pins: "<reference>.<number>" ("U3.4")
  string net        = 5;  // the item's net, if it has one ("/SDA")
  string layer      = 6;  // PCB: the item's layer ("F.Cu"); through-hole pads and vias: the
                          // first copper layer of their set; empty in the schematic
  string sheet_path = 7;  // schematic: the human sheet path the item is on ("/", "/Power/");
                          // empty on the PCB
  double x_mm       = 8;  // the item's position (anchor: footprint/symbol origin, pad/pin
  double y_mm       = 9;  // position, a track's start, ...)
  BoxMm  bbox       = 10; // the item's bounding box
  string value      = 11; // footprints and symbols: their value ("10k"); empty otherwise
}

message Comment
{
  string               note       = 1;  // what the person typed (UTF-8, may span lines)
  ItemNames            names      = 2;  // references, nets and pins of the selection (as in
                                        // ET_SELECTION_CHANGED), also copied to Event.selection
  repeated CommentItem items      = 3;  // every selected item, in selection order (at most 500;
                                        // `truncated` is set when there were more)
  bool                 truncated  = 4;
  BoxMm                bbox       = 5;  // the whole selection's bounding box.  With nothing
                                        // selected: the area of the canvas in view, and
                                        // `items` is empty (a comment on that region)
  bool                 empty_selection = 6;
  string               sheet_path = 7;  // schematic: the sheet shown when the comment was made
  string               screenshot = 8;  // absolute path of a PNG of the canvas around `bbox`
                                        // (padded, at most 800 px on its long side), under
                                        // <dir of the API socket>/backplane-comments/.  Empty
                                        // when none could be taken (say, the frame is hidden).
                                        // KiCad keeps the 32 newest; copy it if you need it.
  BoxMm                screenshot_region = 9;  // the document area the PNG shows, mm
  int32                screenshot_width  = 10; // pixels
  int32                screenshot_height = 11;
  bool                 from_api   = 12; // made by CommentSelection, not the person's dialog
}

// Make a comment on the current selection of the PCB editor or the schematic editor without the
// dialog, exactly as if the person had typed `note` in "Comment to Backplane..." and pressed OK:
// an ET_COMMENT event is pushed.  Routed by `kind` like SelectItems: the frame must be open (a
// kind whose frame is not open answers AS_UNHANDLED).  The screenshot needs the frame shown.
// While a modal dialog is open it answers AS_BUSY.
message CommentSelection
{
  FrameKind kind = 1;  // FK_PCB or FK_SCH
  string    note = 2;
  bool      capture_only = 3;  // bp.13: return the Comment (names, items, bbox, screenshot) only:
                               // no ET_COMMENT, no dialog, `note` ignored; the reply's seq is 0
}

message CommentSelectionResponse
{
  uint64  seq     = 1;  // the seq of the ET_COMMENT event pushed
  Comment comment = 2;  // the same comment
}


// One long job's progress (bp.12).  Event.frame is the frame the job runs in (kind FK_UNKNOWN
// when none).  The first event is sent at once, updates at most every 100 ms (none in a job's
// first 150 ms), and `done` always.
message Progress
{
  uint64 id          = 1;  // the job, unique per process, the same from start to done
  string title       = 2;  // "Loading Schematic", "Filling Zones", ...
  string detail      = 3;  // the current step or item; may be empty
  double fraction    = 4;  // 0..1, or -1 when indeterminate
  bool   done        = 5;  // the job's last event, also after a cancel or a failure
  bool   cancellable = 6;  // CancelProgress{id} stops it
  bool   cancelled   = 7;  // with done: it ended because it was cancelled
}

// Ask a running cancellable job to stop.  Answered at once, even while the job keeps KiCad's
// UI thread busy; the job ends with a done event (cancelled true) when it reaches its next
// check.
message CancelProgress
{
  uint64 id = 1;
}

message CancelProgressResponse
{
  bool cancelling = 1;
}


// Open GerbView (FK_GERBVIEW) on a set of fabrication outputs, replacing what it showed (bp.13).
message OpenGerbers
{
  repeated string files = 1;   // .gbr/.gtl/...; .drl/.xln; a .gbrjob loads its listed layers
  bool            show  = 2;   // also show the frame (else it opens hidden, like a prewarm)
  int32 x = 3; int32 y = 4; int32 width = 5; int32 height = 6;   // as ShowFrame
}

message OpenGerbersResponse
{
  FrameInfo       frame  = 1;
  repeated string loaded = 2;
  repeated string failed = 3;   // with the reason in `errors` at the same index
  repeated string errors = 4;
}
