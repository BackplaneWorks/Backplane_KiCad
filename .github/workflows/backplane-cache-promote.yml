name: Backplane KiCad cache promote

# A run can read only its own ref's caches and the default branch's (main). Release-line and
# candidate builds therefore don't save caches of their own. Each one uploads its caches as a
# 1-day artifact named ccache-<platform>-<sha>, and this workflow, which runs on main, saves them
# as main's caches. That's one rolling compiler cache entry per platform, plus Windows' vcpkg
# binary cache per vcpkg graph. Every new candidate branch and every tag then restores warm.
#
# Only the fork's own successful push or workflow_dispatch runs on release/** or a candidate
# branch (^fix/bp<N>(.<M>)*-final<k>$) write main's caches. Never a pull request, a fork or a
# feature branch. Only cache entries are deleted (main's older entries of the same platform),
# never artifacts or runs.
#
# actions/cache matches an entry by its path and compression as well as its key. Each platform
# is therefore saved on the same runner (and container) as its build, under the same path.
on:
  workflow_run:
    # A workflow whose file is also on main is matched by main's name for it: the Linux workflow
    # is "Backplane KiCad Linux release" on main and "...runtime (upstream master base)" on the
    # release line, so both names are listed.
    workflows:
      - Backplane KiCad macOS
      - Backplane KiCad Linux release
      - Backplane KiCad Linux runtime (upstream master base)
      - Backplane KiCad Windows
    types: [completed]
  # Promote one finished run by hand (a run whose promote didn't fire), under the same rules
  workflow_dispatch:
    inputs:
      run_id:
        description: The build run whose compiler cache to promote
        required: true

permissions:
  contents: read

concurrency:
  group: cache-promote-${{ github.event.workflow_run.workflow_id || inputs.run_id }}
  cancel-in-progress: false

env:
  RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      artifact: ${{ steps.gate.outputs.artifact }}
      platform: ${{ steps.gate.outputs.platform }}
    steps:
      # The run is read back from the API for both triggers, so a hand promote has the same rules:
      # a successful push or workflow_dispatch run of this repo, on release/** or a candidate branch
      - name: Release line or candidate branch, and the run's own artifact
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id: $RUN_ID" >&2; exit 1; }
          IFS=$'\t' read -r CONCLUSION EVENT HEAD_REPO HEAD_BRANCH HEAD_SHA WF_PATH < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            -q '[.conclusion // "", .event, .head_repository.full_name, .head_branch, .head_sha, .path] | @tsv')
          case "$WF_PATH" in
            .github/workflows/backplane-macos.yml|.github/workflows/backplane-linux-release.yml|.github/workflows/backplane-windows.yml) ;;
            *) echo "::notice::run $RUN_ID is $WF_PATH, not a KiCad build: nothing promoted"; exit 0 ;;
          esac
          if [ "$CONCLUSION" != success ] || ! [[ "$EVENT" =~ ^(push|workflow_dispatch)$ ]] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::run $RUN_ID is $CONCLUSION/$EVENT from $HEAD_REPO: nothing promoted"
            exit 0
          fi
          if ! [[ "$HEAD_BRANCH" =~ ^release/ || "$HEAD_BRANCH" =~ ^fix/bp[0-9]+(\.[0-9]+)*-final[0-9]*$ ]]; then
            echo "::notice::$HEAD_BRANCH is neither release/** nor a candidate branch: nothing promoted"
            exit 0
          fi
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            -q "[.artifacts[] | select(.expired == false and (.name | test(\"^ccache-(macos-ARM64|linux-x86_64|windows-x64)-$HEAD_SHA\$\"))) | .name][0] // \"\"")
          if [ -z "$name" ]; then echo "::notice::run $RUN_ID uploaded no compiler cache"; exit 0; fi
          platform=${name#ccache-}; platform=${platform%%-*}
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "promoting $name from run $RUN_ID ($HEAD_BRANCH @ ${HEAD_SHA:0:10})" >> "$GITHUB_STEP_SUMMARY"

  macos:
    needs: gate
    if: needs.gate.outputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.backplane-ccache
    outputs:
      key: ${{ steps.unpack.outputs.key }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/in
      - name: Unpack
        id: unpack
        run: |
          set -euo pipefail
          prefix=$(tr -d '[:space:]' < "$RUNNER_TEMP/in/ccache/key-prefix")
          [[ "$prefix" =~ ^kicad-macos-[A-Za-z0-9]+-[0-9a-f]{12}-$ ]] || { echo "bad key prefix: $prefix" >&2; exit 1; }
          mkdir -p "$CCACHE_DIR"
          tar -C "$CCACHE_DIR" -xf "$RUNNER_TEMP/in/ccache/data.tar"
          rm -rf "$RUNNER_TEMP/in"; du -sh "$CCACHE_DIR"
          echo "key=${prefix}main-$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.unpack.outputs.key }}

  linux:
    needs: gate
    if: needs.gate.outputs.platform == 'linux'
    runs-on: ubuntu-24.04
    # The build's own container, so ~ and the compression match its restore
    container:
      image: ubuntu:26.04
    timeout-minutes: 30
    permissions:
      actions: read
    outputs:
      key: ${{ steps.unpack.outputs.key }}
    steps:
      - name: Tools the build container has
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates zstd
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/in
      - name: Unpack
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(tr -d '[:space:]' < "$RUNNER_TEMP/in/ccache/key-prefix")
          [[ "$prefix" =~ ^kicad-ccache-Linux-[0-9a-f]{12}-$ ]] || { echo "bad key prefix: $prefix" >&2; exit 1; }
          mkdir -p ~/.cache/ccache
          tar -C ~/.cache/ccache -xf "$RUNNER_TEMP/in/ccache/data.tar" --no-same-owner
          rm -rf "$RUNNER_TEMP/in"; du -sh ~/.cache/ccache
          echo "key=${prefix}main-$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.unpack.outputs.key }}

  windows:
    needs: gate
    if: needs.gate.outputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      actions: read
    outputs:
      key: ${{ steps.unpack.outputs.key }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/in
      - name: Unpack
        id: unpack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $in = Join-Path $env:RUNNER_TEMP 'in'
          $prefix = (Get-Content (Join-Path $in 'ccache\key-prefix') -Raw).Trim()
          if ($prefix -notmatch '^kicad-windows-ccache-[0-9a-f]{12}-$') { throw "bad key prefix: $prefix" }
          New-Item -ItemType Directory -Force C:\bp\ccache | Out-Null
          tar -C C:/bp/ccache -xf (Join-Path $in 'ccache\data.tar')
          "key=${prefix}main-$env:RUN_ID" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          if (Test-Path (Join-Path $in 'vcpkg\data.tar')) {
            $vk = (Get-Content (Join-Path $in 'vcpkg\key') -Raw).Trim()
            if ($vk -notmatch '^kicad-windows-vcpkg-[0-9a-f]{64}$') { throw "bad vcpkg key: $vk" }
            New-Item -ItemType Directory -Force C:\bp\vcpkg-cache | Out-Null
            tar -C C:/bp/vcpkg-cache -xf (Join-Path $in 'vcpkg\data.tar')
            "vcpkg_key=$vk" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }
          Remove-Item -Recurse -Force $in
      - uses: actions/cache/save@v4
        with:
          path: C:\bp\ccache
          key: ${{ steps.unpack.outputs.key }}
      # Saved once per vcpkg graph: a key that main already has is refused by the cache service.
      - uses: actions/cache/save@v4
        if: steps.unpack.outputs.vcpkg_key != ''
        continue-on-error: true
        with:
          path: C:\bp\vcpkg-cache
          key: ${{ steps.unpack.outputs.vcpkg_key }}

  # main keeps one compiler cache entry per platform: the newest. Older ones (any toolchain) go.
  prune:
    needs: [gate, macos, linux, windows]
    if: always() && (needs.macos.result == 'success' || needs.linux.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep one rolling entry per platform
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ needs.gate.outputs.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos) family=kicad-macos- ;;
            linux) family=kicad-ccache-Linux- ;;
            windows) family=kicad-windows-ccache- ;;
            *) exit 0 ;;
          esac
          mapfile -t entries < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&key=$family&sort=created_at&direction=desc&per_page=100" \
            -q '.actions_caches[] | "\(.id) \(.key)"')
          for i in "${!entries[@]}"; do
            if [ "$i" -eq 0 ]; then echo "kept ${entries[$i]}" | tee -a "$GITHUB_STEP_SUMMARY"; continue; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/${entries[$i]%% *}"
            echo "deleted ${entries[$i]}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
