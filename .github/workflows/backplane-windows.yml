name: Backplane KiCad Windows

on:
  workflow_dispatch:
  pull_request:
    branches: ['backplane/master']
  push:
    branches: ['backplane/master']

permissions:
  contents: read

# A newer push or dispatch on the same branch queues behind the running build instead of cancelling
# it: superseded candidates are cancelled by hand with the guard (docs/release-playbook.md).
concurrency:
  group: windows-kicad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Native Windows x64 runtime and IPC
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VCPKG_ROOT: C:\bp\vcpkg
      VCPKG_BINARY_SOURCES: 'clear;nuget,https://gitlab.com/api/v4/projects/27426693/packages/nuget/index.json,read;files,C:\bp\vcpkg-cache,readwrite'
      VCPKG_DEFAULT_BINARY_CACHE: C:\bp\vcpkg-cache
      VCPKG_MAX_CONCURRENCY: '4'
      # ccache in front of cl (scripts/backplane-windows.ps1, BACKPLANE_WIN_CCACHE: KiCad's USE_CCACHE
      # with /Z7; the PDBs are still linked), the same compiler cache as bp-winbuild. A compiler is
      # known by its contents, so a runner image or MSVC update misses rather than reusing objects.
      # Off unless the repository variable BACKPLANE_WIN_CCACHE is set (an empty value is off in the ps1),
      # until a warm build's package is shown equal to a cold one's.
      BACKPLANE_WIN_CCACHE: ${{ vars.BACKPLANE_WIN_CCACHE }}
      CCACHE_DIR: C:\bp\ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: '1'
      CCACHE_MAXSIZE: 3.5G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Preserve LF and enable Git long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native IPC test client
        # The pinned vcpkg graph supplies protoc 33.4 (Python gencode 6.33.4).
        run: python -m pip install protobuf==6.33.4 pynng==0.9.0
      - name: ccache for MSVC, and the compiler cache key (toolchain)
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '4.14.3'
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$v/ccache-$v-windows-x86_64.zip" -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'ccache-zip')
          $dir = 'C:\bp\tools\ccache'
          New-Item -ItemType Directory -Force $dir, $env:CCACHE_DIR | Out-Null
          Copy-Item (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ccache-zip') -Recurse -Filter ccache.exe | Select-Object -First 1).FullName $dir
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $cl = (& cl 2>&1 | Select-Object -First 1) -join ''
          $text = "$env:ImageOS $env:ImageVersion $cl ccache $v"
          $sha = [Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($text))
          $id = (-join ($sha | ForEach-Object { $_.ToString('x2') })).Substring(0, 12)
          "prefix=kicad-windows-ccache-$id-" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      # Both caches live on main only (backplane-cache-promote.yml on main saves them from this run's
      # artifact): every branch and tag restores main's entries.
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: C:\bp\ccache
          key: ${{ steps.toolchain.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.toolchain.outputs.prefix }}
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: C:\bp\vcpkg-cache
          key: kicad-windows-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/custom_vcpkg_triplets/**') }}
          restore-keys: kicad-windows-vcpkg-
      - name: Stage the pinned KiCad libraries and 3D models
        shell: bash
        run: |
          set -euo pipefail
          command -v git-lfs >/dev/null || { echo 'git-lfs is required for the 3D models' >&2; exit 1; }
          stage="$RUNNER_TEMP/kicad-library-stage"
          bash scripts/backplane-libraries.sh "$stage" --with-3d
          echo "BACKPLANE_LIBRARY_STAGE=$(cygpath -w "$stage")" >> "$GITHUB_ENV"
      - name: Build, relocate, test and package
        shell: pwsh
        run: ./scripts/backplane-windows.ps1
      # Branches don't save caches of their own. The compiler cache (and the vcpkg binary cache, when
      # main has none for this vcpkg graph yet) go up as a 1-day artifact, and the promote workflow
      # on main saves them as main's when this run is a successful release-line or candidate run.
      - name: Pack the caches for main
        # Only a ccache-on build adds to the cache; an off build would re-upload main's entry unchanged
        if: always() && steps.compiler-cache.outcome == 'success' && env.BACKPLANE_WIN_CCACHE != ''
        shell: pwsh
        env:
          PREFIX: ${{ steps.toolchain.outputs.prefix }}
          VCPKG_KEY: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
          VCPKG_HIT: ${{ steps.vcpkg-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'ccache-out'
          New-Item -ItemType Directory -Force (Join-Path $out 'ccache') | Out-Null
          ccache --evict-older-than 2d
          ccache --show-stats
          Set-Content (Join-Path $out 'ccache\key-prefix') $env:PREFIX
          tar -C C:/bp/ccache -cf (Join-Path $out 'ccache\data.tar') .
          if ($env:VCPKG_HIT -ne 'true' -and (Test-Path C:\bp\vcpkg-cache)) {
            New-Item -ItemType Directory -Force (Join-Path $out 'vcpkg') | Out-Null
            Set-Content (Join-Path $out 'vcpkg\key') $env:VCPKG_KEY
            tar -C C:/bp/vcpkg-cache -cf (Join-Path $out 'vcpkg\data.tar') .
          }
      - uses: actions/upload-artifact@v4
        # Only a ccache-on build adds to the cache; an off build would re-upload main's entry unchanged
        if: always() && steps.compiler-cache.outcome == 'success' && env.BACKPLANE_WIN_CCACHE != ''
        with:
          name: ccache-windows-x64-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/ccache-out
          if-no-files-found: ignore
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-kicad-diagnostics
          retention-days: 7
          path: |
            C:/bp/build/CMakeCache.txt
            C:/bp/build/CMakeFiles/CMakeConfigureLog.yaml
            C:/bp/build/vcpkg-manifest-install.log
          if-no-files-found: ignore
      - name: Preserve unvalidated installed runtime after a test failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content BACKPLANE_VERSION -Raw).Trim()
          $candidate = Join-Path $env:GITHUB_WORKSPACE "release\windows\backplane-kicad-windows-x86_64-$version"
          if (!(Test-Path $candidate)) { $candidate = 'C:\bp\stage' }
          # Only preserve an install whose dependency-license assembly finished.
          # This is debugging material, never the validated release artifact.
          if (Test-Path (Join-Path $candidate 'licenses\VCPKG_PACKAGES.txt')) {
            $out = Join-Path $env:GITHUB_WORKSPACE 'windows-unvalidated-diagnostics'
            New-Item -ItemType Directory -Force $out | Out-Null
            git rev-parse HEAD | Set-Content (Join-Path $out 'SOURCE_COMMIT')
            Set-Content (Join-Path $out 'UNVALIDATED.txt') 'Native install only. Runtime tests failed; do not treat this as an accepted runtime or release.'
            Compress-Archive -Path $candidate -DestinationPath (Join-Path $out 'unvalidated-runtime.zip')
            git archive --format=tar.gz --prefix=source/ "--output=$out/source.tar.gz" HEAD
            Get-ChildItem $out -File | Where-Object Name -ne SHA256SUMS | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
            } | Set-Content (Join-Path $out 'SHA256SUMS')
          }
      - name: Upload unvalidated runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-kicad-unvalidated-diagnostics
          retention-days: 1
          compression-level: 0
          path: windows-unvalidated-diagnostics/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-kicad-windows-x86_64
          retention-days: 7
          compression-level: 0
          path: |
            release/windows/*.zip
            release/windows/*.tar.gz
            release/windows/SHA256SUMS
          if-no-files-found: error
