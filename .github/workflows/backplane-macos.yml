name: Backplane KiCad macOS
on:
  push:
    # every batch on the release line and ci/** (a macOS break fails the batch like Linux and
    # Windows). Do not trigger on backplane-kicad-v* tags (releases are built on our Mac mini
    # and published explicitly); use workflow_dispatch for manual fallback builds.
    branches: ['release/bp.13', 'ci/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-kicad-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    name: Native Apple silicon runtime, relocation and IPC
    runs-on: macos-15
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}/.backplane-ccache
      # A compiler is known by its contents, so a runner image or Xcode update misses rather than
      # reusing objects; the size cap keeps main's one rolling entry (and its artifact) small.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build and test dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cmake ninja pkg-config ccache boost cairo curl eigen fontconfig freetype glew glm harfbuzz libgit2 ngspice opencascade pixman protobuf@29 rapidjson sqlite unixodbc wxwidgets yaml-cpp zint zstd glslang spirv-tools spirv-cross
          python -m pip install protobuf==5.29.6 pynng==0.9.0
          # The KiCad 3D models are Git LFS objects (scripts/backplane-libraries.sh --with-3d)
          brew install git-lfs || true
      - name: nng 1.x (Homebrew ships 2.0, whose API KiCad does not use)
        run: |
          # v1.12.3; the relocation step bundles the dylib by its absolute install name.
          git clone --quiet https://github.com/nanomsg/nng.git "$RUNNER_TEMP/nng-src"
          git -C "$RUNNER_TEMP/nng-src" checkout --quiet 73f715235967afc783e0b99c52d015dc10897fda
          cmake -S "$RUNNER_TEMP/nng-src" -B "$RUNNER_TEMP/nng-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DNNG_TESTS=OFF -DNNG_TOOLS=OFF -DNNG_ENABLE_NNGCAT=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/nng" -DCMAKE_INSTALL_NAME_DIR="$RUNNER_TEMP/nng/lib"
          cmake --build "$RUNNER_TEMP/nng-build"
          cmake --install "$RUNNER_TEMP/nng-build"
          echo "BACKPLANE_NNG_PREFIX=$RUNNER_TEMP/nng" >> "$GITHUB_ENV"
          echo "BACKPLANE_NNG_SOURCE=$RUNNER_TEMP/nng-src" >> "$GITHUB_ENV"
      # The cache lives on main only (backplane-cache-promote.yml on main saves it from this run's
      # artifact): every branch and tag restores main's latest entry for this toolchain.
      - name: Compiler cache key (toolchain)
        id: toolchain
        run: |
          id=$( { sw_vers -productVersion; xcodebuild -version; clang --version; } | shasum -a 256 | cut -c1-12)
          echo "prefix=kicad-macos-${{ runner.arch }}-$id-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.toolchain.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.toolchain.outputs.prefix }}
      - name: Build, relocate, test and package
        run: |
          python scripts/backplane-macos-relocate-test.py
          bash scripts/backplane-macos.sh
      - name: Retain compiled bundle when a later packaging gate fails
        if: failure()
        run: |
          if [ -x stage-macos/KiCad.app/Contents/MacOS/kicad-cli ]; then
            tar -C stage-macos -czf "$RUNNER_TEMP/backplane-macos-stage.tar.gz" KiCad.app
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-kicad-compiled-stage-${{ github.sha }}
          retention-days: 7
          compression-level: 0
          path: ${{ runner.temp }}/backplane-macos-stage.tar.gz
          if-no-files-found: ignore
      # Branches don't save caches of their own. The compiler cache goes up as a 1-day artifact,
      # and the promote workflow on main saves it as main's cache when this run is a successful
      # release-line or candidate run.
      - name: Pack the compiler cache for main
        if: always() && steps.compiler-cache.outcome == 'success'
        run: |
          ccache --evict-older-than 2d || true
          ccache --show-stats || true
          mkdir -p "$RUNNER_TEMP/ccache-out/ccache"
          echo "${{ steps.toolchain.outputs.prefix }}" > "$RUNNER_TEMP/ccache-out/ccache/key-prefix"
          tar -C "$CCACHE_DIR" -cf "$RUNNER_TEMP/ccache-out/ccache/data.tar" .
      - uses: actions/upload-artifact@v4
        if: always() && steps.compiler-cache.outcome == 'success'
        with:
          name: ccache-macos-${{ runner.arch }}-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/ccache-out
          if-no-files-found: ignore
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-kicad-diagnostics
          retention-days: 7
          path: |
            build/backplane-macos/CMakeCache.txt
            build/backplane-macos/CMakeFiles/CMakeConfigureLog.yaml
            release/macos/*.json
            release/macos/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-kicad-macos-native
          retention-days: 7
          compression-level: 0
          path: |
            release/macos/*.tar.gz
            release/macos/SHA256SUMS
          if-no-files-found: error

      # `kicad --embedded` over a stand-in host on the runner's logged-in desktop (BACKPLANE_EMBED.md,
      # "macOS"): placement, stacking, Cmd+Z/S/C/V without a visible menu bar, reserved chords,
      # prewarm, first click, host hide and host death.  After the archive is uploaded, so a failure
      # here can be reproduced from it.
      - name: Embedded GUI check on the macOS desktop
        if: always() && hashFiles('release/macos/*.tar.gz') != ''
        run: |
          python -m pip install pyobjc-framework-Quartz pillow
          export PATH="$(brew --prefix protobuf@29)/bin:$PATH"
          root=$(ls -d release/macos/backplane-kicad-darwin-arm64-*/ | head -1)
          python scripts/backplane-embed-macos-check.py "${root}bin/kicad" "${root}bin/kicad-cli" --out "$RUNNER_TEMP/embed-macos"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-macos-check
          retention-days: 7
          path: ${{ runner.temp }}/embed-macos
          if-no-files-found: ignore
